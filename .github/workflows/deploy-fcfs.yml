name: Deploy SatoDrops FCFS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm a production Tempo deployment"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: default
      SATODROPS_FEE_RECIPIENT: ${{ secrets.SATODROPS_FEE_RECIPIENT }}
      SATODROPS_VERIFICATION_SIGNER: ${{ secrets.SATODROPS_VERIFICATION_SIGNER }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.TEMPO_DEPLOYER_PRIVATE_KEY }}
      TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/fcfs-human-verification

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SATODROPS_FEE_RECIPIENT}" || { echo "Missing SATODROPS_FEE_RECIPIENT"; exit 1; }
          test -n "${SATODROPS_VERIFICATION_SIGNER}" || { echo "Missing SATODROPS_VERIFICATION_SIGNER"; exit 1; }
          test -n "${DEPLOYER_PRIVATE_KEY}" || { echo "Missing TEMPO_DEPLOYER_PRIVATE_KEY"; exit 1; }
          test -n "${TEMPO_RPC_URL}" || { echo "Missing TEMPO_RPC_URL"; exit 1; }

          chain_id="$(cast chain-id --rpc-url "${TEMPO_RPC_URL}")"
          test "${chain_id}" = "4217" || {
            echo "Wrong network. Expected Tempo mainnet chain ID 4217, got ${chain_id}."
            exit 1
          }

          echo "Deployer address: $(cast wallet address "${DEPLOYER_PRIVATE_KEY}")"
          echo "Fee recipient: ${SATODROPS_FEE_RECIPIENT}"
          echo "Verification signer: ${SATODROPS_VERIFICATION_SIGNER}"

      - name: Build contracts
        run: forge build --sizes

      - name: Deploy SatoDropsFCFS
        shell: bash
        run: |
          set -euo pipefail
          forge create contracts/SatoDropsFCFS.sol:SatoDropsFCFS \
            --rpc-url "${TEMPO_RPC_URL}" \
            --private-key "${DEPLOYER_PRIVATE_KEY}" \
            --broadcast \
            --legacy \
            -vvvv \
            --constructor-args "${SATODROPS_FEE_RECIPIENT}" "${SATODROPS_VERIFICATION_SIGNER}"

      - name: Deployment reminder
        run: |
          echo "Deployment completed."
          echo "Copy the deployed SatoDropsFCFS address from the deployment output."
          echo "Then configure NEXT_PUBLIC_SATODROPS_FCFS_CONTRACT_ADDRESS in Vercel."
