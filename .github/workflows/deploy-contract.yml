name: Deploy TestingGas Contract

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tempo Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          echo "$HOME/.config/.foundry/bin" >> "$GITHUB_PATH"
          foundryup -n tempo
      - name: Install forge-std
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          forge install foundry-rs/forge-std --no-commit
      - name: Build TestingGas
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          forge build
      - name: Deploy TestingGas to Tempo mainnet
        env:
          PRIVATE_KEY: ${{ secrets.TEMPO_DEPLOYER_PRIVATE_KEY }}
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          test -n "$PRIVATE_KEY"
          forge script script/DeployTestingGas.s.sol:DeployTestingGas --rpc-url https://rpc.tempo.xyz --private-key "$PRIVATE_KEY" --broadcast
          echo "TestingGas deployment completed."
