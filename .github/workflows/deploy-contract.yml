name: Deploy SatoDrops Contract

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tempo Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          echo "$HOME/.config/.foundry/bin" >> "$GITHUB_PATH"
          foundryup -n tempo

      - name: Install forge-std
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          forge install foundry-rs/forge-std --no-commit

      - name: Build contracts
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          forge build

      - name: Deploy to Tempo mainnet
        env:
          PRIVATE_KEY: ${{ secrets.TEMPO_DEPLOYER_PRIVATE_KEY }}
          FEE_RECIPIENT: ${{ secrets.SATODROPS_FEE_RECIPIENT }}
          FEE_TOKEN: "0x20c000000000000000000000b9537d11c60e8b50"
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"

          test -n "$PRIVATE_KEY"
          test -n "$FEE_RECIPIENT"

          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          echo "Deployer: $DEPLOYER"

          echo "Checking USDC balance for gas..."
          BALANCE="$(cast call "$FEE_TOKEN"             "balanceOf(address)(uint256)" "$DEPLOYER"             --rpc-url https://rpc.tempo.xyz)"
          echo "USDC balance (base units): $BALANCE"

          test "$BALANCE" != "0"

          OUTPUT="$(forge create contracts/SatoDrops.sol:SatoDrops             --rpc-url https://rpc.tempo.xyz             --private-key "$PRIVATE_KEY"             --broadcast             --tempo.fee-token "$FEE_TOKEN"             --constructor-args "$FEE_RECIPIENT")"

          echo "$OUTPUT"

          ADDRESS="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Deployed to: //p' | tail -n 1)"
          TX_HASH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Transaction hash: //p' | tail -n 1)"
          test -n "$ADDRESS"
          test -n "$TX_HASH"

          echo "SATODROPS_CONTRACT_ADDRESS=$ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SATODROPS_CONTRACT_ADDRESS=$ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SATODROPS_DEPLOYMENT_TX=$TX_HASH" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment reminder
        run: |
          echo "Deployment complete."
          echo "Set NEXT_PUBLIC_SATODROPS_CONTRACT_ADDRESS and NEXT_PUBLIC_SATODROPS_DEPLOYMENT_TX to the values above in the frontend hosting environment."
